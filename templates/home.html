{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Django-dicussion Board</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css'%}">
</head>
<body>
  <div class="container">

    <nav aria-label="breadcrumb ">
      <ol class="breadcrumb my-4 p-3 mb-2 bg-secondary">
        <li class="breadcrumb-item active text-dark">Boards</li>
      </ol>
    </nav>
  <table class="table table-secondary">
    <thead class="table-dark">
      <tr >
        <th>Board </th>
        <th>Posts</th>
        <th>Topic</th>
        <th>Last Post</th>
      </tr>
    </thead>
    <tbody>
        {% for board in boards %}
        <tr>
          <td><a href="{% url 'board_topics' board.pk %}">{{board.name}}</a>
             <small class="text-muted d-block">{{board.discription}}</small></td>
          <td>0</td>
          <td>0</td>
          <td></td>
        </tr>
        {% endfor %}
    </tbody>
  </table>

</div>
</body>
</html>
